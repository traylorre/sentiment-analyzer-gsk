# Consolidated PR Checks Workflow
# ================================
#
# Runs all PR quality checks in parallel for faster feedback.
# Consolidates: pr-check-lint.yml, pr-check-test.yml, pr-check-security.yml, pr-check-codeql.yml
#
# For On-Call Engineers:
#   - All jobs run in parallel for fast feedback
#   - Check individual job for failure details
#   - Coverage must be >80% or test job fails
#
# For Developers:
#   - Run locally: make validate && make test-unit
#   - Fix lint: ruff format src/ tests/ && ruff check src/ tests/ --fix

name: PR Checks

on:
  workflow_dispatch:
  push:
    branches: [main, 'dependabot/**']
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 9am UTC for security scans
    - cron: '0 9 * * 1'

env:
  PYTHON_VERSION: '3.13'

jobs:
  # ========================================================================
  # JOB 1: Lint (ruff format + ruff check)
  # ========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.8.4

      - name: Check formatting with ruff
        # Note: Black removed in feat(057) - Ruff formatter preserves pragma comments
        run: ruff format --check --diff src/ tests/

      - name: Check linting with ruff
        run: ruff check src/ tests/

      - name: Check for security issues
        run: ruff check src/ --select S --output-format=github

  # ========================================================================
  # JOB 2: Test (pytest + coverage)
  # ========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Use CI-specific requirements (excludes 2GB+ torch/transformers - tests mock them)
          pip install -r requirements-ci.txt
          pip install -e .

      - name: Run tests with coverage
        run: |
          pytest --ignore=tests/integration/test_analysis_preprod.py \
            --ignore=tests/integration/test_dashboard_preprod.py \
            --ignore=tests/integration/test_canary_preprod.py \
            --ignore=tests/integration/test_ingestion_preprod.py \
            --ignore=tests/integration/test_e2e_lambda_invocation_preprod.py \
            --ignore=tests/integration/test_observability_preprod.py \
            --ignore=tests/integration/timeseries \
            --ignore=tests/e2e \
            --cov=src --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
        env:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing  # pragma: allowlist secret

      - name: Check coverage threshold
        run: coverage report --fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            test-results.xml
          retention-days: 30

      - name: Comment coverage on PR
        uses: py-cov-action/python-coverage-comment-action@v3
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60

  # ========================================================================
  # JOB 3: Security (pip-audit)
  # ========================================================================
  security:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      # Audit-trail artifacts (non-blocking). --no-deps audits the pinned top-level
      # surface without resolving/downloading the 2GB torch layer.
      - name: Generate audit JSON (artifact trail)
        run: |
          pip-audit -r requirements.txt --no-deps --format json --output prod-audit.json || true
          pip-audit -r requirements-dev.txt --no-deps --format json --output dev-audit.json || true

      # Feature 1400: BLOCKING gate. Replaces the old advisory `|| true` +
      # continue-on-error. Sustainable via .pip-audit-ignore (curated, auto-expiring
      # ignores). A new/unignored vuln OR an expired ignore entry fails this job.
      - name: Dependency vulnerability gate (blocking)
        run: ./scripts/pip-audit-gate.sh

      - name: Upload audit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pip-audit-results
          path: |
            prod-audit.json
            dev-audit.json
          retention-days: 90

  # ========================================================================
  # JOB: Pre-commit Hooks (validator gate — Feature 1400)
  # ------------------------------------------------------------------------
  # Makes the previously local-only pre-commit hooks (bandit, trivy, checkov,
  # ruff, detect-secrets, ...) actually GATE on every PR. Runs in parallel with
  # the other jobs, so marginal wall-clock is ~zero.
  #
  # Runbook — "red without a repo diff": trivy's vuln DB updates daily, so a new
  # CVE can turn this red with no code change. That is the tool working, not flake.
  # Escape hatch is an expiry-disciplined ignore (never `--exit-code 0`).
  # ========================================================================
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Terraform (for terraform_fmt hook)
        uses: hashicorp/setup-terraform@v3

      - name: Install pre-commit + system-hook dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          # checkov + detect-secrets are language:system / substitute-step tools.
          pip install pre-commit==4.6.0 checkov==3.2.497 detect-secrets==1.5.45
          # trivy is a language:system hook — install the pinned binary on PATH.
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.69.3

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit (blocking)
        env:
          # detect-secrets: local autostage wrapper mutates + git-adds the baseline
          #   (a retry-until-stable loop) — no place in a blocking gate. CI runs the
          #   non-mutating detect-secrets-hook substitute step below instead.
          # gitleaks: already a dedicated blocking job (secrets-scan) — running it
          #   twice buys nothing.
          # NOTE: pytest / check-branch-collision / check-error-log-assertions are
          #   stages:[push] and mypy is stages:[manual], so `run --all-files` never
          #   invokes them. check-false-pass-patterns uses --staged-only and thus
          #   NO-OPS in CI (nothing is staged) — it gates local commits only; not
          #   claimed as CI coverage here (honesty, per this feature's whole point).
          SKIP: detect-secrets,gitleaks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Detect secrets (non-mutating, blocking)
        # Substitute for the skipped autostage wrapper. Read-only: compares secret
        # hashes against the committed baseline, exits 1 on any NEW secret. Excludes
        # tests/ (matches the local hook scope; gitleaks still scans tests/).
        run: |
          FILES="$(git ls-files | grep -vE '^tests/|^\.secrets\.baseline$')"
          detect-secrets-hook --baseline .secrets.baseline $FILES

  # ========================================================================
  # JOB 4: CodeQL Analysis
  # ========================================================================
  codeql:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

  # ========================================================================
  # JOB 5: Secrets Scan (Gitleaks)
  # ========================================================================
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================================================
  # JOB 6: Cost Analysis (Infracost - PR only)
  # ========================================================================
  cost:
    name: Cost
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Infracost
        uses: infracost/actions/setup@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - name: Generate Infracost diff
        run: |
          infracost breakdown --path infrastructure/terraform --format json --out-file /tmp/infracost-base.json || true
          cd ${{ github.workspace }}
          infracost breakdown --path infrastructure/terraform --format json --out-file /tmp/infracost-pr.json || true
          infracost diff --path /tmp/infracost-pr.json --compare-to /tmp/infracost-base.json --format json --out-file /tmp/infracost-diff.json || true
        continue-on-error: true

      - name: Post Infracost comment
        run: |
          infracost comment github \
            --path /tmp/infracost-diff.json \
            --repo $GITHUB_REPOSITORY \
            --github-token ${{ github.token }} \
            --pull-request ${{ github.event.pull_request.number }} \
            --behavior update
        continue-on-error: true

  # ========================================================================
  # JOB: Playwright Chaos Tests (Feature 1265)
  # ========================================================================
  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements-ci.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: |
          cd frontend
          # Exclude @external-api tests — they hit real Tiingo/Finnhub APIs.
          # Run nightly via nightly-e2e.yml instead. DO NOT REMOVE this flag.
          timeout 900 npx playwright test tests/e2e/*.spec.ts \
            --project="Desktop Chrome" \
            --workers=4 \
            --retries=0 \
            --reporter=html,list \
            --grep-invert "@external-api"

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-e2e-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-e2e-results
          path: frontend/test-results/
          retention-days: 7

    timeout-minutes: 20
