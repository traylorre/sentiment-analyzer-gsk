# Consolidated PR Checks Workflow
# ================================
#
# Runs all PR quality checks in parallel for faster feedback.
# Consolidates: pr-check-lint.yml, pr-check-test.yml, pr-check-security.yml, pr-check-codeql.yml
#
# For On-Call Engineers:
#   - All jobs run in parallel for fast feedback
#   - Check individual job for failure details
#   - Coverage must be >80% or test job fails
#
# For Developers:
#   - Run locally: make validate && make test-unit
#   - Fix lint: ruff format src/ tests/ && ruff check src/ tests/ --fix

name: PR Checks

on:
  workflow_dispatch:
  push:
    branches: [main, 'dependabot/**']
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 9am UTC for security scans
    - cron: '0 9 * * 1'

env:
  PYTHON_VERSION: '3.13'

jobs:
  # ========================================================================
  # JOB 1: Lint (ruff format + ruff check)
  # ========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.14

      - name: Check formatting with ruff
        # Note: Black removed in feat(057) - Ruff formatter preserves pragma comments
        run: ruff format --check --diff src/ tests/

      - name: Check linting with ruff
        run: ruff check src/ tests/

      - name: Check for security issues
        run: ruff check src/ --select S --output-format=github

      # waitForResponse race guard (002-waitforresponse-lint-guard, FR-004).
      #
      # Why a Playwright race scan lives in a job named `Lint`: `Lint` is one of
      # main's required status checks and `Pre-commit Hooks` is not, so this is the
      # only place the guard can actually block a merge. If you are tidying this job
      # and this step looks misfiled, it is not. Moving it into `Pre-commit Hooks`
      # or a job of its own silently downgrades the guard to advisory, with no
      # symptom until a race merges green. Required contexts verified 2026-07-30:
      #   gh api repos/traylorre/sentiment-analyzer-gsk/branches/main/protection \
      #     --jq .required_status_checks.contexts
      #
      # Invoked directly rather than through pre-commit so the `Pre-commit Hooks`
      # job's SKIP env cannot reach it. No pip install: the detector is stdlib-only
      # and setup-python above already provides 3.13.
      #
      # `if: always()` because steps are fail-fast and this one is last. Without it
      # any ruff failure means the guard never runs and reports nothing. The job
      # still fails either way; this just makes both failures visible in one run.
      - name: Check waitForResponse race ordering
        if: always()
        run: python3 scripts/scan-waitforresponse-race.py

      # Dead scanning-suppression guard (001-bad-tag-filter-dead-suppression,
      # FR-018, FR-019).
      #
      # Why it lives in `Lint` and not in `Pre-commit Hooks`: `Lint` is one of
      # main's required status checks and `Pre-commit Hooks` is not, so this is
      # the only place the guard can block a merge. Moving it silently downgrades
      # the guard to advisory, with no symptom until a violation merges green.
      # Required contexts verified 2026-07-31:
      #   gh api repos/traylorre/sentiment-analyzer-gsk/branches/main/protection \
      #     --jq .required_status_checks.contexts
      #
      # Invoked directly rather than through pre-commit so the `Pre-commit Hooks`
      # job's SKIP env cannot reach it, and directly rather than through
      # `make audit-pragma` because that target also runs bandit, which this job
      # does not install. No pip install here: the checker is stdlib-only and
      # setup-python above already provides 3.13.
      #
      # `if: always()` because steps are fail-fast and this one is last. Without
      # it any earlier failure means the guard never runs and reports nothing.
      - name: Check for dead scanning suppressions
        if: always()
        run: python3 scripts/check_dead_suppressions.py

      # Legacy-term scan (001-validate-gate-repair, FR-022 / FR-022a).
      #
      # Same reasoning as the guard above, and for the same reason it is worth
      # repeating rather than cross-referencing: `Lint` is a required status check
      # and `Pre-commit Hooks` is not, so joining this job is what makes the scan
      # able to block a merge. A pre-commit hook for the same checker exists and is
      # deliberately secondary; it gives fast local feedback and enforces nothing.
      # Required contexts verified 2026-07-30:
      #   gh api repos/traylorre/sentiment-analyzer-gsk/branches/main/protection \
      #     --jq .required_status_checks.contexts
      #
      # Invoked directly rather than through pre-commit so the `Pre-commit Hooks`
      # job's SKIP env cannot reach it. No pip install: the checker is stdlib-only
      # and setup-python above already provides 3.13.
      #
      # `if: always()` because steps are fail-fast. Without it an earlier lint
      # failure means this never runs and the corpus goes unchecked, which is the
      # precise shape of the defect this feature exists to remove: a stage that
      # never executed reading as a stage that passed.
      #
      # The checker fails closed on an unusable configuration, so a failure here
      # may mean "the checker is broken" rather than "a term was found". The two
      # are distinguished by the message, never by the exit code.
      - name: Check for legacy framework terms
        if: always()
        run: python3 scripts/check_banned_terms.py

  # ========================================================================
  # JOB 2: Test (pytest + coverage)
  # ========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Use CI-specific requirements (excludes 2GB+ torch/transformers - tests mock them)
          pip install -r requirements-ci.txt
          pip install -e .

      - name: Run tests with coverage
        run: |
          pytest --ignore=tests/integration/test_analysis_preprod.py \
            --ignore=tests/integration/test_dashboard_preprod.py \
            --ignore=tests/integration/test_canary_preprod.py \
            --ignore=tests/integration/test_ingestion_preprod.py \
            --ignore=tests/integration/test_e2e_lambda_invocation_preprod.py \
            --ignore=tests/integration/test_observability_preprod.py \
            --ignore=tests/integration/timeseries \
            --ignore=tests/e2e \
            --cov=src --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
        env:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing  # pragma: allowlist secret

      - name: Check coverage threshold
        run: coverage report --fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            test-results.xml
          retention-days: 30

      - name: Comment coverage on PR
        uses: py-cov-action/python-coverage-comment-action@v3
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60

  # ========================================================================
  # JOB 3: Security (pip-audit)
  # ========================================================================
  security:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      # Audit-trail artifacts (non-blocking). --no-deps audits the pinned top-level
      # surface without resolving/downloading the 2GB torch layer.
      - name: Generate audit JSON (artifact trail)
        run: |
          pip-audit -r requirements.txt --no-deps --format json --output prod-audit.json || true
          pip-audit -r requirements-dev.txt --no-deps --format json --output dev-audit.json || true

      # Feature 1400: BLOCKING gate. Replaces the old advisory `|| true` +
      # continue-on-error. Sustainable via .pip-audit-ignore (curated, auto-expiring
      # ignores). A new/unignored vuln OR an expired ignore entry fails this job.
      - name: Dependency vulnerability gate (blocking)
        run: ./scripts/pip-audit-gate.sh

      - name: Upload audit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pip-audit-results
          path: |
            prod-audit.json
            dev-audit.json
          retention-days: 90

  # ========================================================================
  # JOB: Pre-commit Hooks (validator gate — Feature 1400)
  # ------------------------------------------------------------------------
  # Makes the previously local-only pre-commit hooks (bandit, trivy, checkov,
  # ruff, detect-secrets, ...) actually GATE on every PR. Runs in parallel with
  # the other jobs, so marginal wall-clock is ~zero.
  #
  # Runbook — "red without a repo diff": trivy's vuln DB updates daily, so a new
  # CVE can turn this red with no code change. That is the tool working, not flake.
  # Escape hatch is an expiry-disciplined ignore (never `--exit-code 0`).
  # ========================================================================
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Terraform (for terraform_fmt hook)
        uses: hashicorp/setup-terraform@v4

      - name: Install pre-commit + system-hook dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          # checkov + detect-secrets are language:system / substitute-step tools.
          # bc-detect-secrets is Bridgecrew's fork (a checkov dependency); it ships
          # the `detect-secrets` CLI and wrote our .secrets.baseline ("version":
          # "1.5.45"). Upstream detect-secrets stops at 1.5.0 — do not pin it.
          pip install pre-commit==4.6.0 checkov==3.2.508 bc-detect-secrets==1.5.45
          # trivy is a language:system hook — install the pinned binary on PATH.
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.69.3

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Named "(blocking)" until 002 T005. It is not: the `Pre-commit Hooks` job is
      # not among main's required status checks, so a red run here does not prevent
      # a merge. Verified 2026-07-30; re-check rather than trusting this line:
      #   gh api repos/traylorre/sentiment-analyzer-gsk/branches/main/protection \
      #     --jq .required_status_checks.contexts
      - name: Run pre-commit (advisory, not merge-blocking)
        env:
          # detect-secrets: local autostage wrapper mutates + git-adds the baseline
          #   (a retry-until-stable loop) — no place in a blocking gate. CI runs the
          #   non-mutating detect-secrets-hook substitute step below instead.
          # gitleaks: already a dedicated blocking job (secrets-scan) — running it
          #   twice buys nothing.
          # NOTE: pytest / check-branch-collision / check-error-log-assertions are
          #   stages:[push] and mypy is stages:[manual], so `run --all-files` never
          #   invokes them. check-false-pass-patterns uses --staged-only and thus
          #   NO-OPS in CI (nothing is staged) — it gates local commits only; not
          #   claimed as CI coverage here (honesty, per this feature's whole point).
          SKIP: detect-secrets,gitleaks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Detect secrets (non-mutating, blocking)
        # Substitute for the skipped autostage wrapper. Read-only: compares secret
        # hashes against the committed baseline, exits 1 on any NEW secret. Excludes
        # tests/ (matches the local hook scope; gitleaks still scans tests/).
        run: |
          FILES="$(git ls-files | grep -vE '^tests/|^\.secrets\.baseline$')"
          detect-secrets-hook --baseline .secrets.baseline $FILES

  # ========================================================================
  # JOB 4: CodeQL Analysis
  #
  # This job's status contexts are generated PER MATRIX VALUE: the job is named
  # "Analyze" and reports as "Analyze (python)" and "Analyze (javascript-typescript)",
  # one context per language. Editing or removing a matrix value RETIRES the
  # corresponding context. Nothing requires these contexts today, so nothing breaks
  # right now. If CodeQL is ever promoted to a required check, branch protection will
  # name the per-language string and a later matrix edit would silently retire the
  # context that names it. Do not edit this matrix without checking required status
  # checks in the same change.
  # ========================================================================
  codeql:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript-typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

  # ========================================================================
  # JOB 5: Secrets Scan (Gitleaks)
  # ========================================================================
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================================================
  # JOB 6: Cost Analysis (Infracost - PR only)
  # ========================================================================
  cost:
    name: Cost
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Infracost
        uses: infracost/actions/setup@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - name: Generate Infracost diff
        run: |
          infracost breakdown --path infrastructure/terraform --format json --out-file /tmp/infracost-base.json || true
          cd ${{ github.workspace }}
          infracost breakdown --path infrastructure/terraform --format json --out-file /tmp/infracost-pr.json || true
          infracost diff --path /tmp/infracost-pr.json --compare-to /tmp/infracost-base.json --format json --out-file /tmp/infracost-diff.json || true
        continue-on-error: true

      - name: Post Infracost comment
        run: |
          infracost comment github \
            --path /tmp/infracost-diff.json \
            --repo $GITHUB_REPOSITORY \
            --github-token ${{ github.token }} \
            --pull-request ${{ github.event.pull_request.number }} \
            --behavior update
        continue-on-error: true

  # ========================================================================
  # JOB: Playwright E2E Tests -- BLOCKING (merge-required)
  #
  # Runs every spec EXCEPT tests/e2e/chaos*.spec.ts. Chaos injection was never
  # completed, so chaos reds are not a signal about product health and must not
  # gate merges (owner decision 2026-07-30). They still run, in the separate
  # non-blocking playwright-chaos job below, so the signal is not lost.
  #
  # This job's name is a required status check on main. Renaming it silently
  # disables the gate, because branch protection matches on the job NAME --
  # a required context that no job reports stays permanently pending, and a
  # renamed job reports under a name nothing requires. Do not rename it
  # without updating branch protection in the same change.
  # ========================================================================
  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements-ci.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Run E2E tests (blocking, excludes chaos)
        run: |
          cd frontend
          # Chaos specs are excluded here and run in the non-blocking
          # playwright-chaos job instead. Chaos injection was never completed.
          SPECS=$(ls tests/e2e/*.spec.ts | grep -v '/chaos' | tr '\n' ' ')
          if [ -z "$SPECS" ]; then
            echo "::error::No non-chaos specs matched - the glob or the exclude is wrong."
            echo "This would otherwise report a vacuous green on a required check."
            exit 1
          fi
          echo "Blocking suite: $(echo "$SPECS" | wc -w) spec files"
          # Exclude @external-api tests — they hit real Tiingo/Finnhub APIs.
          # Run nightly via nightly-e2e.yml instead. DO NOT REMOVE this flag.
          timeout 900 npx playwright test $SPECS \
            --project="Desktop Chrome" \
            --workers=4 \
            --retries=0 \
            --reporter=html,list \
            --grep-invert "@external-api"

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-e2e-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-e2e-results
          path: frontend/test-results/
          retention-days: 7

    timeout-minutes: 20

  # ========================================================================
  # JOB: Playwright Chaos Tests -- NON-BLOCKING (Feature 1265)
  #
  # Chaos injection was never completed, so these reds are not a signal about
  # product health (owner decision 2026-07-30). They run for visibility and
  # MUST NOT be added to main's required status checks until chaos work is
  # finished. Known-broken today: the 3 chaos-error-boundary tests can only
  # pass against a dev server, because the window.__TEST_FORCE_ERROR reader is
  # stripped from production builds -- see CLEANUP-BOARD.html.
  #
  # This job does NOT use continue-on-error. A red here is meant to be visible
  # as a red job; it simply is not a required context, so it cannot block a
  # merge. continue-on-error would paint it green and hide the signal we are
  # deliberately keeping.
  # ========================================================================
  playwright-chaos:
    name: Playwright Chaos Tests (non-blocking)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements-ci.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Run chaos E2E tests
        run: |
          cd frontend
          SPECS=$(ls tests/e2e/chaos*.spec.ts | tr '\n' ' ')
          if [ -z "$SPECS" ]; then
            echo "::error::No chaos specs matched - the glob is wrong."
            exit 1
          fi
          echo "Chaos suite: $(echo "$SPECS" | wc -w) spec files"
          timeout 900 npx playwright test $SPECS \
            --project="Desktop Chrome" \
            --workers=4 \
            --retries=0 \
            --reporter=html,list \
            --grep-invert "@external-api"

      - name: Upload chaos Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-chaos-report
          path: frontend/playwright-report/
          retention-days: 7

    timeout-minutes: 20
