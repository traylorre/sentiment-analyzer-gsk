# Pre-commit Configuration
# ========================
#
# Industry-standard git hooks for code quality and testing.
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type pre-push
#
# Usage:
#   - Hooks run automatically on commit (formatting/linting) and push (tests)
#   - Skip hooks: git commit --no-verify (NOT recommended)
#   - Run manually: pre-commit run --all-files
#
# For On-Call Engineers:
#   If hooks fail in CI but not locally:
#   1. Do NOT run `pre-commit autoupdate` — ruff is version-locked across five
#      surfaces (requirements-dev.txt, requirements-ci.txt, pyproject.toml,
#      pr-checks.yml lint job, and the rev below). pyproject's
#      [tool.ruff] required-version rejects any other binary, so an autoupdate
#      past the rev bricks every commit. Ruff upgrades are a deliberate
#      multi-surface operation: see specs/001-ruff-bump-forward.
#   2. Run: pre-commit run --all-files
#   3. Check Python/Terraform versions match CI
#
# For Developers:
#   - Add pre-commit to requirements-dev.txt
#   - Run pre-commit install after cloning repo
#   - Hooks catch issues before they reach CI

# Default hook types to install
default_install_hook_types: [pre-commit, pre-push]

# Default stages for hooks
default_stages: [commit]

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-json
      - id: check-toml

  # Python formatter and linter (Ruff)
  # Note: Black removed in feat(057) - Ruff formatter preserves pragma comments
  # (# noqa, # nosec, # type:) by excluding them from line length calculations
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Terraform formatter and security scanners
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.83.6
    hooks:
      - id: terraform_fmt
        args:
          - --args=-recursive
      # tfsec and checkov removed from pre-commit-terraform hooks:
      # - tfsec deprecated, doesn't support TF 1.5 check blocks → local trivy hook
      # - checkov baseline needs repo-root path but hook cd's into module dirs → local hook

  # Security checks - detect hardcoded secrets
  # NOTE: Using local wrapper to auto-stage baseline updates (eliminates churn)
  # The detect-secrets hook updates line numbers in .secrets.baseline on each scan,
  # which causes infinite loops during commit. The wrapper auto-stages these changes.
  # See: scripts/detect-secrets-autostage.sh and docs/ci-gotchas.md
  - repo: local
    hooks:
      - id: detect-secrets
        name: Detect secrets
        entry: ./scripts/detect-secrets-autostage.sh
        language: script
        exclude: >
          (?x)^(
            tests/.*|
            \.secrets\.baseline
          )$

  # Gitleaks - additional secret detection with broader patterns
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks

  # Bandit - Python security linter (SAST)
  # Added in 070-validation-blindspot-audit to catch security vulnerabilities locally
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4  # Feature 1400: aligned with requirements-{dev,ci}.txt (was 1.7.10 drift)
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-ll", "-r", "src/"]
        pass_filenames: false

  # Local hooks for project-specific checks
  - repo: local
    hooks:
      # Trivy IaC scan (replaces tfsec, supports TF 1.5 check blocks)
      # Feature 1400 / FR-006: intended to flip --exit-code 0 → 1 so it can gate.
      # BLOCKED: current infra has 5 HIGH findings (AWS-0132 S3 non-CMK encryption in
      # bootstrap/main.tf; AWS-0031 ECR mutable tags x4 in main.tf). Flipping now would
      # born-red the pre-commit gate, violating the "land green first" rule (FR-007).
      # TODO(1400-followup): remediate the 5 HIGH IaC findings, then flip to
      # --exit-code 1. Escape hatch per AR3-F2: never regress to decorative once green.
      - id: trivy-terraform
        name: Trivy IaC scan
        entry: trivy config --exit-code 0 --severity HIGH,CRITICAL --tf-exclude-downloaded-modules infrastructure/terraform/
        language: system
        files: \.tf$
        pass_filenames: false

      # Checkov with baseline (local hook because pre-commit-terraform cd's into
      # module dirs, breaking relative baseline paths)
      - id: checkov-terraform
        name: Checkov IaC scan
        entry: bash -c 'checkov --quiet --compact --framework terraform --baseline "$(git rev-parse --show-toplevel)/.checkov.baseline" -d infrastructure/terraform/'
        language: system
        files: \.tf$
        pass_filenames: false

      # Run pytest on push only (not on every commit)
      # NOTE: Uses .venv/bin/python3 explicitly because pre-commit runs in its own
      # subprocess and doesn't inherit an activated venv. Requires bootstrap first.
      - id: pytest
        name: pytest
        entry: bash -c '.venv/bin/python3 -m pytest tests/unit -x --tb=short -q'
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [push]

      # Type checking (optional - can be slow)
      - id: mypy
        name: mypy
        entry: python -m mypy src/ --ignore-missing-imports
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [manual]  # Run with: pre-commit run mypy --hook-stage manual

      # Branch collision detection (143-orphan-branch-prevention)
      # Prevents pushing to a branch name that already exists on remote without a PR
      # This catches cases where a push fails, we create a new branch, but the old
      # branch is left orphaned on remote without a PR to clean it up.
      - id: check-branch-collision
        name: Check for orphaned remote branches
        entry: ./scripts/check-branch-collision.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [push]

      # ERROR log assertion validation (086-test-debt-burndown)
      # Validates that ERROR logs in tests have assert_error_logged() calls
      - id: check-error-log-assertions
        name: Check ERROR log assertions
        entry: ./scripts/check-error-log-assertions.sh
        language: script
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [push]

      # False-pass pattern detection (093-e2e-false-pass-remediation)
      # Blocks tests that skip on 500 errors instead of failing
      - id: check-false-pass-patterns
        name: Check E2E false-pass patterns
        entry: ./scripts/check-false-pass-patterns.sh --staged-only
        language: script
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [commit]

      # waitForResponse race guard (002-waitforresponse-lint-guard)
      # Blocks act-then-wait races in the CUSTOMER dashboard Playwright suite at
      # frontend/tests/e2e/. This is not the admin pytest suite under tests/.
      #
      # `entry` is a bare `python3`, deliberately NOT `.venv/bin/python3` like the
      # `pytest` hook above. The same command runs as a step in the CI `Lint` job,
      # where there is no venv — Python 3.13 comes from actions/setup-python. The
      # detector is stdlib-only and carries its own sys.version_info >= (3, 13)
      # floor, so a bare interpreter is both sufficient and portable. Do not
      # "fix" this toward the pytest hook's form: it would work on a developer
      # laptop and fail everywhere else.
      #
      # pass_filenames is false and the detector ignores positional arguments, so
      # it always scans its whole root. That is load-bearing, not incidental: a
      # commit touching no .ts file must still be scanned, and the guard must see
      # untracked files that pre-commit would never hand it.
      - id: scan-waitforresponse-race
        name: Check waitForResponse race ordering
        entry: python3 scripts/scan-waitforresponse-race.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

# CI Integration (Feature 1400 — validator gating):
# The `pre-commit` job in .github/workflows/pr-checks.yml runs these hooks on every
# PR to main (`pre-commit run --all-files --show-diff-on-failure`). It is NOT a
# blocking gate. `Pre-commit Hooks` is not among main's required status checks, so a
# red run here does not prevent a merge. Verified 2026-07-30; the required contexts
# were ["Secrets Scan", "Lint", "Run Tests", "Playwright E2E Tests"]. Do not trust
# that list, re-check it:
#   gh api repos/traylorre/sentiment-analyzer-gsk/branches/main/protection \
#     --jq .required_status_checks.contexts
# This is exactly why the scan-waitforresponse-race hook above is ALSO a step in the
# `Lint` job (002 FR-004). As a pre-commit hook alone it would be advisory, and a
# contributor who skipped local hooks could merge a race with every check green.
# It SKIPs detect-secrets (local autostage wrapper mutates+git-adds the baseline — no
# place in a gate; CI runs the non-mutating detect-secrets-hook step instead) and
# gitleaks (already a dedicated blocking `secrets-scan` job). CI and local hooks are
# otherwise kept in sync. See specs/1400-validator-gating/.
